  .message { font-size: 24px; color: var(--dark); margin-bottom: 20px; }
  .hint { font-size: 16px; color: #aaa; }
  .back-link { display: inline-block; margin-top: 40px; padding: 15px 40px; background: var(--gradient); color: #fff; text-decoration: none; border-radius: 50px; font-weight: 600; transition: transform 0.3s; }
  .back-link:hover { transform: scale(1.05); }
  @media (max-width: 768px) {

    .nav-toggle { display: flex; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 5px; cursor: pointer; padding: 10px; z-index: 1001; }

  <script>
    // Mobile navigation - hide on scroll down, show on scroll up
    let lastScrollTop = 0;
    const nav = document.querySelector('nav');
    
    function toggleNav() {
      nav.classList.toggle('open');
      document.querySelector('.nav-toggle').classList.toggle('active');
    }
    
    // Open Taobao app or fallback to web
    function openTaobaoApp(itemId) {
      const taobaoUrl = 'https://item.taobao.com/item.htm?id=' + itemId;
      const taobaoScheme = 'taobao://' + itemId;
      
      // Try to open Taobao app first
      window.location.href = taobaoScheme;
      
      // Fallback to web after a short delay if app doesn't open
      setTimeout(function() {
        window.location.href = taobaoUrl;
      }, 1500);
    }
    
    window.addEventListener('scroll', () => {
      if (window.innerWidth <= 768) {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 100) {
          // Scrolling down - hide nav
          nav.classList.add('hidden');
          nav.classList.remove('open');
          document.querySelector('.nav-toggle').classList.remove('active');
        } else {
          // Scrolling up - show nav
          nav.classList.remove('hidden');
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
      }
    });
  </script>
