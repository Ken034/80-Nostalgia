<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --primary: #ff6b6b; --dark: #2d3436; --gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
  body { font-family: 'Noto Sans SC', sans-serif; background: linear-gradient(180deg, #fff5f5 0%, #f3e5f5 100%); min-height: 100vh; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); box-shadow: 0 4px 30px rgba(0,0,0,0.1); }
  nav ul { list-style: none; display: flex; justify-content: center; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  nav a { display: block; color: var(--dark); text-decoration: none; font-size: 15px; font-weight: 600; padding: 18px 20px; transition: all 0.3s; }
  nav a:hover { color: var(--primary); background: rgba(255,107,107,0.1); }
  .container { max-width: 1200px; margin: 0 auto; padding: 150px 20px 100px; text-align: center; }
  h1 { font-family: 'ZCOOL KuaiLe', cursive; font-size: clamp(48px, 8vw, 72px); background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; letter-spacing: 6px; }
  .subtitle { font-size: 20px; color: #888; margin-bottom: 50px; letter-spacing: 3px; }
  .empty-state { background: #fff; border-radius: 30px; padding: 80px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
  .emoji { font-size: 100px; margin-bottom: 30px; animation: bounce 2s ease-in-out infinite; display: inline-block; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  .message { font-size: 24px; color: var(--dark); margin-bottom: 20px; }
  .hint { font-size: 16px; color: #aaa; }
  .back-link { display: inline-block; margin-top: 40px; padding: 15px 40px; background: var(--gradient); color: #fff; text-decoration: none; border-radius: 50px; font-weight: 600; transition: transform 0.3s; }
  .back-link:hover { transform: scale(1.05); }
@media (max-width: 768px) { .nav-toggle { display: flex; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 5px; cursor: pointer; padding: 10px; z-index: 1001; } .nav-toggle span { width: 25px; height: 3px; background: var(--primary); border-radius: 2px; transition: all 0.3s; } .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); } .nav-toggle.active span:nth-child(2) { opacity: 0; } .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); } nav ul { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; } nav.open ul { max-height: 500px; } nav.hidden { transform: translateY(-100%); } nav.hidden.open { transform: translateY(0); } } @media (min-width: 769px) { .nav-toggle { display: none !important; } }
</style>

    <div class="nav-toggle" onclick="toggleNav()"><span></span><span></span><span></span></div>
  </nav>
  <div class="container">
    <h1>🍉 我的暑假</h1>
    <p class="subtitle">西瓜、冰棍、还珠格格，还有写不完的作业</p>
    <div class="empty-state">
      <span class="emoji">🍉</span>
      <p class="message">内容正在加载中...</p>
      <p class="hint">这里将展示属于 80 后的珍贵回忆</p>
      <a href="index.html" class="back-link">返回首页</a>
    </div>
  </div>
  <script>
    // Mobile navigation - hide on scroll down, show on scroll up
    let lastScrollTop = 0;
    const nav = document.querySelector('nav');
    
    function toggleNav() {
      nav.classList.toggle('open');
      document.querySelector('.nav-toggle').classList.toggle('active');
    }
    
    window.addEventListener('scroll', () => {
      if (window.innerWidth <= 768) {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 100) {
          // Scrolling down - hide nav
          nav.classList.add('hidden');
          nav.classList.remove('open');
          document.querySelector('.nav-toggle').classList.remove('active');
        } else {
          // Scrolling up - show nav
          nav.classList.remove('hidden');
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
      }
    });
  </script>
</body>
