  <script>
    document.addEventListener('mousemove', e => { const icons = document.querySelectorAll('.game-icon'); const x = e.clientX/window.innerWidth; const y = e.clientY/window.innerHeight; icons.forEach((icon, i) => { icon.style.transform = `translate(${x*(i+1)*15}px, ${y*(i+1)*15}px)`; }); });
    
    // Gomoku Game Logic
    const BOARD_SIZE = 15;
    let board = [];
    let currentPlayer = 'black';
    let gameMode = 'pvc'; // 'pvp' or 'pvc'
    let gameOver = false;
    let blackScore = 0;
    let whiteScore = 0;
    let lastMove = null;

    function initBoard() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = i;
          cell.dataset.col = j;
          cell.onclick = () => handleCellClick(i, j);
          boardEl.appendChild(cell);
        }
      }
    }

    function setGameMode(mode) {
      gameMode = mode;
      document.getElementById('pvpBtn').classList.toggle('active', mode === 'pvp');
      document.getElementById('pvcBtn').classList.toggle('active', mode === 'pvc');
      document.getElementById('player2Label').textContent = mode === 'pvc' ? '白棋 (电脑)' : '白棋 (玩家 2)';
      resetGame();
    }

    function resetGame() {
      initBoard();
      currentPlayer = 'black';
      gameOver = false;
      lastMove = null;
      updateStatus();
      closeModal();
    }

    function handleCellClick(row, col) {
      if (gameOver || board[row][col] !== null) return;
      
      placeStone(row, col, currentPlayer);
      
      if (checkWin(row, col, currentPlayer)) {
        endGame(currentPlayer);
        return;
      }
      
      if (isDraw()) {
        endGame('draw');
        return;
      }
      
      currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
      updateStatus();
      
      if (gameMode === 'pvc' && currentPlayer === 'white' && !gameOver) {
        setTimeout(computerMove, 500);
      }
    }

    function placeStone(row, col, player) {
      board[row][col] = player;
      const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
      cell.classList.add(player);
      
      if (lastMove) {
        document.querySelector(`.cell[data-row="${lastMove.row}"][data-col="${lastMove.col}"]`).classList.remove('last-move');
      }
      lastMove = { row, col };
      cell.classList.add('last-move');
    }

    function checkWin(row, col, player) {
      const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      
      for (const [dr, dc] of directions) {
        let count = 1;
        let winningCells = [{ row, col }];
        
        for (let i = 1; i < 5; i++) {
          const r = row + dr * i;
          const c = col + dc * i;
          if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
            count++;
            winningCells.push({ row: r, col: c });
          } else break;
        }
        
        for (let i = 1; i < 5; i++) {
          const r = row - dr * i;
          const c = col - dc * i;
          if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
            count++;
            winningCells.push({ row: r, col: c });
          } else break;
        }
        
        if (count >= 5) {
          winningCells.forEach(cell => {
            document.querySelector(`.cell[data-row="${cell.row}"][data-col="${cell.col}"]`).classList.add('winning');
          });
          return true;
        }
      }
      return false;
    }

    function isDraw() {
      return board.every(row => row.every(cell => cell !== null));
    }

    function endGame(winner) {
      gameOver = true;
      const modal = document.getElementById('gameModal');
      const title = document.getElementById('modalTitle');
      const message = document.getElementById('modalMessage');
      
      if (winner === 'black') {
        blackScore++;
        document.getElementById('blackScore').textContent = blackScore;
        title.textContent = '🎉 黑棋获胜！';
        message.textContent = gameMode === 'pvc' ? '恭喜你战胜了电脑！' : '玩家 1 获胜！';
      } else if (winner === 'white') {
        whiteScore++;
        document.getElementById('whiteScore').textContent = whiteScore;
        title.textContent = '🎉 白棋获胜！';
        message.textContent = gameMode === 'pvc' ? '电脑获胜，再接再厉！' : '玩家 2 获胜！';
      } else {
        title.textContent = '🤝 平局！';
        message.textContent = '棋盘已满，势均力敌！';
      }
      
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('gameModal').classList.remove('show');
    }

    function updateStatus() {
      const status = document.getElementById('gameStatus');
      if (gameMode === 'pvc' && currentPlayer === 'white') {
        status.textContent = '🤖 电脑思考中...';
      } else {
        status.textContent = currentPlayer === 'black' ? '⚫ 黑棋落子' : '⚪ 白棋落子';
      }
    }

    // Advanced AI with Minimax and Alpha-Beta Pruning
    function computerMove() {
      if (gameOver) return;
      
      const bestMove = findBestMove();
      if (bestMove) {
        handleCellClick(bestMove.row, bestMove.col);
      }
    }

    function findBestMove() {
      // First, check if we can win immediately
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          if (board[i][j] === null) {
            board[i][j] = 'white';
            if (checkWinInstant(i, j, 'white')) {
              board[i][j] = null;
              return { row: i, col: j };
            }
            board[i][j] = null;
          }
        }
      }
      
      // Block opponent's winning move
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          if (board[i][j] === null) {
            board[i][j] = 'black';
            if (checkWinInstant(i, j, 'black')) {
              board[i][j] = null;
              return { row: i, col: j };
            }
            board[i][j] = null;
          }
        }
      }
      
      // Use minimax with alpha-beta pruning for best move
      let bestScore = -Infinity;
      let bestMove = null;
      
      // Get candidate moves (near existing stones)
      const candidates = getCandidateMoves();
      
      for (const move of candidates) {
        board[move.row][move.col] = 'white';
        const score = minimax(board, 2, false, -Infinity, Infinity);
        board[move.row][move.col] = null;
        
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }
      
      return bestMove || candidates[0];
    }

    function getCandidateMoves() {
      const candidates = [];
      const visited = new Set();
      
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          if (board[i][j] !== null) {
            for (let di = -2; di <= 2; di++) {
              for (let dj = -2; dj <= 2; dj++) {
                const ni = i + di;
                const nj = j + dj;
                if (ni >= 0 && ni < BOARD_SIZE && nj >= 0 && nj < BOARD_SIZE && 
                    board[ni][nj] === null && !visited.has(`${ni},${nj}`)) {
                  candidates.push({ row: ni, col: nj });
                  visited.add(`${ni},${nj}`);
                }
              }
            }
          }
        }
      }
      
      // If board is empty, start from center
      if (candidates.length === 0) {
        const center = Math.floor(BOARD_SIZE / 2);
        candidates.push({ row: center, col: center });
      }
      
      return candidates;
    }

    function minimax(boardState, depth, isMaximizing, alpha, beta) {
      if (depth === 0) {
        return evaluateBoard();
      }
      
      const candidates = getCandidateMoves();
      if (candidates.length === 0) return 0;
      
      if (isMaximizing) {
        let maxScore = -Infinity;
        for (const move of candidates.slice(0, 15)) { // Limit branches for performance
          boardState[move.row][move.col] = 'white';
          if (checkWinInstant(move.row, move.col, 'white')) {
            boardState[move.row][move.col] = null;
            return 100000;
          }
          const score = minimax(boardState, depth - 1, false, alpha, beta);
          boardState[move.row][move.col] = null;
          maxScore = Math.max(maxScore, score);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
        return maxScore;
      } else {
        let minScore = Infinity;
        for (const move of candidates.slice(0, 15)) {
          boardState[move.row][move.col] = 'black';
          if (checkWinInstant(move.row, move.col, 'black')) {
            boardState[move.row][move.col] = null;
            return -100000;
          }
          const score = minimax(boardState, depth - 1, true, alpha, beta);
          boardState[move.row][move.col] = null;
          minScore = Math.min(minScore, score);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return minScore;
      }
    }

    function checkWinInstant(row, col, player) {
      const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      
      for (const [dr, dc] of directions) {
        let count = 1;
        
        for (let i = 1; i < 5; i++) {
          const r = row + dr * i;
          const c = col + dc * i;
          if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
            count++;
          } else break;
        }
        
        for (let i = 1; i < 5; i++) {
          const r = row - dr * i;
          const c = col - dc * i;
          if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
            count++;
          } else break;
        }
        
        if (count >= 5) return true;
      }
      return false;
    }

    function evaluateBoard() {
      let score = 0;
      
      // Evaluate for both players
      score += evaluatePlayer('white');
      score -= evaluatePlayer('black') * 1.2; // Slightly favor blocking human
      
      return score;
    }

    function evaluatePlayer(player) {
      let score = 0;
      const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          if (board[i][j] === player) {
            for (const [dr, dc] of directions) {
              const line = evaluateLine(i, j, dr, dc, player);
              score += line;
            }
          }
        }
      }
      
      return score;
    }

    function evaluateLine(row, col, dr, dc, player) {
      let count = 1;
      let openEnds = 0;
      let blocked = 0;
      
      // Check forward
      let i = 1;
      while (true) {
        const r = row + dr * i;
        const c = col + dc * i;
        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) {
          blocked++;
          break;
        }
        if (board[r][c] === player) {
          count++;
        } else if (board[r][c] === null) {
          openEnds++;
          break;
        } else {
          blocked++;
          break;
        }
        i++;
      }
      
      // Check backward
      i = 1;
      while (true) {
        const r = row - dr * i;
        const c = col - dc * i;
        if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) {
          blocked++;
          break;
        }
        if (board[r][c] === player) {
          count++;
        } else if (board[r][c] === null) {
          openEnds++;
          break;
        } else {
          blocked++;
          break;
        }
        i++;
      }
      
      // Score based on pattern
      if (count >= 5) return 100000;
      if (count === 4) {
        if (openEnds === 2) return 10000;
        if (openEnds === 1) return 1000;
      }
      if (count === 3) {
        if (openEnds === 2) return 1000;
        if (openEnds === 1) return 100;
      }
      if (count === 2) {
        if (openEnds === 2) return 100;
        if (openEnds === 1) return 10;
      }
      
      return count;
    }

    // Initialize game on load
    initBoard();
    setGameMode('pvc');
  </script>
