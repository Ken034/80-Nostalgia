  * { margin: 0; padding: 0; box-sizing: border-box; }

  .game-icon { position: absolute; font-size: 60px; opacity: 0.1; animation: gameFloat 20s ease-in-out infinite; }
  .game-icon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
  .game-icon:nth-child(2) { top: 20%; right: 15%; animation-delay: -4s; }
  .game-icon:nth-child(3) { bottom: 30%; left: 20%; animation-delay: -8s; }
  .game-icon:nth-child(4) { bottom: 20%; right: 10%; animation-delay: -12s; }
  @keyframes gameFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-40px) rotate(180deg); } }
  .content-placeholder { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px; }

  .placeholder-icon { font-size: 100px; margin-bottom: 30px; animation: iconBounce 2s ease-in-out infinite; display: inline-block; }
  @keyframes iconBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
