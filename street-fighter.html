<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter - Classic Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 900px;
            max-width: 95vw;
            background: linear-gradient(180deg, #2d1b4e 0%, #1a1a2e 100%);
            border: 4px solid #ffd700;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 100px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(180deg, #c9a227 0%, #8b6914 100%);
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #ffd700;
        }

        .game-title {
            color: #fff;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #ff6b00;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 3px 3px 0 #000, -1px -1px 0 #ff6b00, 0 0 20px #ffd700; }
            50% { text-shadow: 3px 3px 0 #000, -1px -1px 0 #ff6b00, 0 0 40px #ff6b00; }
        }

        .health-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.5);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .player-name {
            color: #fff;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .health-bar {
            width: 100%;
            height: 25px;
            background: #333;
            border: 3px solid #ffd700;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(180deg, #00ff00 0%, #00aa00 50%, #006600 100%);
            transition: width 0.3s ease-out, background 0.3s;
            border-radius: 3px;
        }

        .health-fill.low {
            background: linear-gradient(180deg, #ff0000 0%, #aa0000 50%, #660000 100%);
        }

        .health-fill.medium {
            background: linear-gradient(180deg, #ffff00 0%, #aaaa00 50%, #666600 100%);
        }

        .vs-text {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        .game-canvas {
            width: 100%;
            height: 400px;
            background: linear-gradient(180deg, #1a1a3e 0%, #2d1b4e 50%, #1a1a2e 100%);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-info {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            color: #fff;
            font-size: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            text-align: center;
        }

        .control-group h4 {
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .key {
            display: inline-block;
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border: 2px solid #666;
            border-radius: 5px;
            padding: 4px 10px;
            margin: 2px;
            font-size: 11px;
            color: #fff;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .game-overlay.hidden {
            display: none;
        }

        .overlay-title {
            color: #ffd700;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 3px 3px 0 #ff0000, -1px -1px 0 #000;
            margin-bottom: 30px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .start-btn {
            background: linear-gradient(180deg, #ff6b00 0%, #cc4400 100%);
            border: 3px solid #ffd700;
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            padding: 15px 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 10px;
            transition: all 0.3s;
            text-shadow: 2px 2px 0 #000;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.8);
        }

        .winner-text {
            color: #00ff00;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        .round-info {
            color: #fff;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .combo-display {
            position: absolute;
            top: 100px;
            font-size: 24px;
            color: #ff0000;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .combo-display.active {
            opacity: 1;
            animation: comboShake 0.5s ease-in-out;
        }

        @keyframes comboShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .embed-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
        }

        .embed-wrapper .game-container {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="embed-wrapper">
        <div class="game-container">
            <div class="game-header">
                <h1 class="game-title">⚔️ Street Battle ⚔️</h1>
            </div>

            <div class="health-bar-container">
                <div class="player-section">
                    <div class="player-name" id="player1Name">PLAYER</div>
                    <div class="health-bar">
                        <div class="health-fill" id="player1Health"></div>
                    </div>
                </div>
                <div class="vs-text">VS</div>
                <div class="player-section">
                    <div class="player-name" id="player2Name">CPU</div>
                    <div class="health-bar">
                        <div class="health-fill" id="player2Health"></div>
                    </div>
                </div>
            </div>

            <div class="game-canvas">
                <canvas id="gameCanvas" width="860" height="400"></canvas>
                <div class="combo-display" id="comboDisplay"></div>
                
                <div class="game-overlay" id="startOverlay">
                    <h2 class="overlay-title">🥊 STREET BATTLE 🥊</h2>
                    <button class="start-btn" onclick="startGame()">FIGHT!</button>
                </div>

                <div class="game-overlay hidden" id="gameOverOverlay">
                    <div class="winner-text" id="winnerText"></div>
                    <div class="round-info" id="roundInfo"></div>
                    <button class="start-btn" onclick="startGame()">REMATCH</button>
                </div>
            </div>

            <div class="controls-info">
                <div class="control-group">
                    <h4>🎮 PLAYER CONTROLS</h4>
                    <span class="key">A</span> Left
                    <span class="key">D</span> Right
                    <span class="key">W</span> Jump
                    <span class="key">S</span> Block
                    <span class="key">J</span> Punch
                    <span class="key">K</span> Kick
                </div>
                <div class="control-group">
                    <h4>🎯 COMBO SYSTEM</h4>
                    <span class="key">J+J</span> Double Punch
                    <span class="key">K+K</span> Double Kick
                    <span class="key">↓→+J</span> Special
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GROUND_Y = 340;
        const GRAVITY = 0.8;
        const FRICTION = 0.85;

        let gameRunning = false;
        let player1, player2;
        let keys = {};
        let round = 1;
        let p1Wins = 0;
        let p2Wins = 0;

        class Fighter {
            constructor(x, color, isPlayer) {
                this.x = x;
                this.y = GROUND_Y;
                this.width = 60;
                this.height = 100;
                this.color = color;
                this.isPlayer = isPlayer;
                this.vx = 0;
                this.vy = 0;
                this.health = 100;
                this.maxHealth = 100;
                this.isAttacking = false;
                this.attackType = null;
                this.attackCooldown = 0;
                this.isBlocking = false;
                this.isHit = false;
                this.hitCooldown = 0;
                this.facing = isPlayer ? 1 : -1;
                this.specialCooldown = 0;
                this.comboCount = 0;
                this.lastAttackTime = 0;
            }

            update() {
                if (this.y < GROUND_Y) {
                    this.vy += GRAVITY;
                }
                this.x += this.vx;
                this.y += this.vy;

                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.vy = 0;
                }

                if (this.x < 30) this.x = 30;
                if (this.x > canvas.width - 30 - this.width) this.x = canvas.width - 30 - this.width;

                this.vx *= FRICTION;

                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.hitCooldown > 0) this.hitCooldown--;
                if (this.specialCooldown > 0) this.specialCooldown--;

                if (this.hitCooldown <= 0) this.isHit = false;

                if (this.attackCooldown <= 0) {
                    this.isAttacking = false;
                    this.attackType = null;
                }
            }

            draw() {
                ctx.save();
                
                if (this.isHit && Math.floor(Date.now() / 50) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const centerX = this.x + this.width / 2;
                const centerY = this.y - this.height / 2;

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, centerY, this.width, this.height * 0.6);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY - 15, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                const eyeOffset = this.facing * 8;
                ctx.beginPath();
                ctx.arc(centerX + eyeOffset - 5, centerY - 18, 6, 0, Math.PI * 2);
                ctx.arc(centerX + eyeOffset + 5, centerY - 18, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(centerX + eyeOffset - 3, centerY - 18, 3, 0, Math.PI * 2);
                ctx.arc(centerX + eyeOffset + 5, centerY - 18, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + 10, centerY + this.height * 0.6, 15, this.height * 0.4);
                ctx.fillRect(this.x + 35, centerY + this.height * 0.6, 15, this.height * 0.4);

                if (this.isAttacking) {
                    ctx.fillStyle = this.color;
                    const armExtend = this.attackType === 'punch' ? 40 : 20;
                    const armY = this.attackType === 'kick' ? centerY + 40 : centerY + 10;
                    
                    if (this.facing === 1) {
                        ctx.fillRect(centerX + 20, armY, armExtend, 12);
                        if (this.attackType === 'punch') {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                            ctx.beginPath();
                            ctx.arc(centerX + 70, armY + 6, 15, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            ctx.fillStyle = 'rgba(255, 200, 0, 0.7)';
                            ctx.beginPath();
                            ctx.arc(centerX + 60, armY + 6, 20, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else {
                        ctx.fillRect(centerX - 20 - armExtend, armY, armExtend, 12);
                        if (this.attackType === 'punch') {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                            ctx.beginPath();
                            ctx.arc(centerX - 50, armY + 6, 15, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            ctx.fillStyle = 'rgba(255, 200, 0, 0.7)';
                            ctx.beginPath();
                            ctx.arc(centerX - 40, armY + 6, 20, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else if (this.isBlocking) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(centerX - 15, centerY - 20, 10, 35);
                    ctx.fillRect(centerX + 5, centerY - 20, 10, 35);
                    
                    ctx.strokeStyle = 'rgba(100, 100, 255, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    if (this.facing === 1) {
                        ctx.arc(centerX + 30, centerY, 40, -Math.PI/2, Math.PI/2);
                    } else {
                        ctx.arc(centerX - 30, centerY, 40, Math.PI/2, -Math.PI/2);
                    }
                    ctx.stroke();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(centerX - 25, centerY + 10, 12, 30);
                    ctx.fillRect(centerX + 13, centerY + 10, 12, 30);
                }

                if (this.attackType === 'special') {
                    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
                    for (let i = 0; i < 5; i++) {
                        const offsetX = this.facing * (30 + i * 15);
                        ctx.beginPath();
                        ctx.arc(centerX + offsetX, centerY + 20, 20 - i * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            attack(type) {
                if (this.attackCooldown > 0 || this.isHit) return false;

                this.isAttacking = true;
                this.attackType = type;
                
                if (type === 'special') {
                    this.attackCooldown = 60;
                    this.specialCooldown = 120;
                } else if (type === 'kick') {
                    this.attackCooldown = 35;
                } else {
                    this.attackCooldown = 25;
                }

                const now = Date.now();
                if (now - this.lastAttackTime < 500) {
                    this.comboCount++;
                } else {
                    this.comboCount = 1;
                }
                this.lastAttackTime = now;

                return true;
            }

            takeDamage(amount) {
                if (this.isHit) return;

                if (this.isBlocking) {
                    amount *= 0.2;
                }

                this.health -= amount;
                this.isHit = true;
                this.hitCooldown = 30;

                this.vx = player1.facing * 10;
                this.vy = -5;

                if (this.health <= 0) {
                    this.health = 0;
                    return true;
                }
                return false;
            }

            move(direction) {
                if (this.isHit) return;
                const speed = 6;
                this.vx = direction * speed;
                this.facing = direction;
            }

            jump() {
                if (this.y >= GROUND_Y && !this.isHit) {
                    this.vy = -18;
                }
            }

            block(isBlocking) {
                if (!this.isHit) {
                    this.isBlocking = isBlocking;
                }
            }
        }

        class AIController {
            constructor(fighter) {
                this.fighter = fighter;
                this.state = 'idle';
                this.stateTimer = 0;
            }

            update(target) {
                const distance = Math.abs(this.fighter.x - target.x);
                const facingTarget = (this.fighter.facing === 1 && target.x > this.fighter.x) ||
                                   (this.fighter.facing === -1 && target.x < this.fighter.x);

                this.stateTimer--;

                if (target.isAttacking && distance < 150 && this.stateTimer <= 0) {
                    if (Math.random() < 0.4) {
                        this.fighter.block(true);
                        this.state = 'blocking';
                        this.stateTimer = 20;
                        return;
                    }
                } else {
                    this.fighter.block(false);
                }

                switch (this.state) {
                    case 'idle':
                        if (distance > 200) {
                            this.state = 'approach';
                            this.stateTimer = 30 + Math.random() * 30;
                        } else if (distance < 80) {
                            this.state = 'attack';
                            this.stateTimer = 20;
                        } else {
                            this.state = 'circle';
                            this.stateTimer = 20 + Math.random() * 20;
                        }
                        break;

                    case 'approach':
                        const dir = target.x > this.fighter.x ? 1 : -1;
                        this.fighter.move(dir);
                        if (this.stateTimer <= 0) this.state = 'idle';
                        break;

                    case 'attack':
                        if (facingTarget && distance < 100) {
                            const rand = Math.random();
                            if (rand < 0.5) {
                                this.fighter.attack('punch');
                            } else if (rand < 0.8) {
                                this.fighter.attack('kick');
                            } else if (this.fighter.specialCooldown <= 0) {
                                this.fighter.attack('special');
                            }
                        }
                        if (this.stateTimer <= 0) this.state = 'idle';
                        break;

                    case 'circle':
                        if (Math.random() < 0.05) {
                            this.fighter.jump();
                        }
                        const circleDir = Math.random() < 0.5 ? 1 : -1;
                        this.fighter.move(circleDir);
                        if (this.stateTimer <= 0) this.state = 'idle';
                        break;

                    case 'blocking':
                        if (this.stateTimer <= 0) this.state = 'idle';
                        break;
                }
            }
        }

        function initFighters() {
            player1 = new Fighter(200, '#3498db', true);
            player2 = new Fighter(600, '#e74c3c', false);
            player2.ai = new AIController(player2);
        }

        function checkAttackCollision(attacker, defender) {
            if (!attacker.isAttacking || attacker.attackCooldown > 15) return;

            const attackRange = attacker.attackType === 'kick' ? 90 : 70;
            const distance = Math.abs((attacker.x + attacker.width/2) - (defender.x + defender.width/2));
            const yDistance = Math.abs(attacker.y - defender.y);

            const isFacing = (attacker.facing === 1 && defender.x > attacker.x) ||
                           (attacker.facing === -1 && defender.x < attacker.x);

            if (distance < attackRange && yDistance < 50 && isFacing) {
                let damage = attacker.attackType === 'kick' ? 12 : 8;
                if (attacker.attackType === 'special') damage = 20;
                
                if (attacker.comboCount > 1) {
                    damage += attacker.comboCount * 2;
                    showCombo(attacker.comboCount);
                }

                const isKO = defender.takeDamage(damage);
                updateHealthBars();

                if (isKO) {
                    handleKO(attacker);
                }
            }
        }

        function showCombo(count) {
            if (count < 2) return;
            
            const comboDisplay = document.getElementById('comboDisplay');
            comboDisplay.textContent = count + ' HIT COMBO!';
            comboDisplay.classList.add('active');
            
            setTimeout(() => {
                comboDisplay.classList.remove('active');
            }, 500);
        }

        function updateHealthBars() {
            const p1Health = document.getElementById('player1Health');
            const p2Health = document.getElementById('player2Health');

            p1Health.style.width = player1.health + '%';
            p2Health.style.width = player2.health + '%';

            p1Health.className = 'health-fill ' + getHealthClass(player1.health);
            p2Health.className = 'health-fill ' + getHealthClass(player2.health);
        }

        function getHealthClass(health) {
            if (health < 30) return 'low';
            if (health < 60) return 'medium';
            return '';
        }

        function handleKO(winner) {
            gameRunning = false;
            
            if (winner.isPlayer) {
                p1Wins++;
            } else {
                p2Wins++;
            }

            setTimeout(() => {
                const overlay = document.getElementById('gameOverOverlay');
                const winnerText = document.getElementById('winnerText');
                const roundInfo = document.getElementById('roundInfo');

                if (winner.isPlayer) {
                    winnerText.textContent = '🏆 YOU WIN! 🏆';
                    winnerText.style.color = '#00ff00';
                } else {
                    winnerText.textContent = '💀 CPU WINS! 💀';
                    winnerText.style.color = '#ff0000';
                }

                roundInfo.textContent = 'Round ' + round + ' | You: ' + p1Wins + ' - CPU: ' + p2Wins;
                overlay.classList.remove('hidden');
            }, 1000);
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(0.5, '#2d1b4e');
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
            ctx.beginPath();
            ctx.arc(750, 80, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            const buildings = [50, 150, 280, 400, 520, 650, 780];
            const heights = [80, 120, 60, 150, 90, 130, 70];
            
            buildings.forEach((x, i) => {
                ctx.fillRect(x, GROUND_Y - heights[i], 80, heights[i]);
                ctx.fillStyle = 'rgba(255, 255, 100, 0.3)';
                for (let wy = GROUND_Y - heights[i] + 10; wy < GROUND_Y - 10; wy += 20) {
                    for (let wx = x + 10; wx < x + 70; wx += 15) {
                        if (Math.random() > 0.5) {
                            ctx.fillRect(wx, wy, 10, 12);
                        }
                    }
                }
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            });

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (keys['KeyA'] || keys['ArrowLeft']) {
                player1.move(-1);
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                player1.move(1);
            }
            
            if (keys['KeyW'] || keys['ArrowUp']) {
                player1.jump();
            }

            player1.block(keys['KeyS'] || keys['ArrowDown']);

            if (keys['KeyJ']) {
                player1.attack('punch');
            } else if (keys['KeyK']) {
                player1.attack('kick');
            }

            if (keys['special']) {
                player1.attack('special');
            }

            player2.ai.update(player1);

            player1.update();
            player2.update();

            checkAttackCollision(player1, player2);
            checkAttackCollision(player2, player1);

            player1.draw();
            player2.draw();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            initFighters();
            updateHealthBars();
            
            gameRunning = true;
            gameLoop();
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'KeyJ' && (keys['ArrowDown'] || keys['KeyS']) && 
                (keys['ArrowRight'] || keys['KeyD'])) {
                keys['special'] = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'KeyJ' || e.code === 'KeyS' || e.code === 'ArrowDown' || 
                e.code === 'KeyD' || e.code === 'ArrowRight') {
                keys['special'] = false;
            }
        });

        drawBackground();
    </script>
</body>
</html>
